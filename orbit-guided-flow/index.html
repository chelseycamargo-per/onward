<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Guided Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Orbit guided flow, autoplaying embed. Light by design, transparent page so it sits on any background. */
:root {
  --ink: oklch(0.22 0.035 205);
  --ink-2: oklch(0.28 0.03 205);
  --body: oklch(0.35 0.025 205);
  --muted: oklch(0.50 0.02 203);
  --faint: oklch(0.58 0.02 203);
  --action: oklch(0.42 0.07 203);
  --action-hover: oklch(0.36 0.065 203);
  --on-action: oklch(0.99 0.002 200);
  --mint: oklch(0.58 0.12 172);
  --mist: oklch(0.94 0.008 200);
  --tile: oklch(0.96 0.008 200);
  --paper: oklch(0.995 0.002 200);
  --line: oklch(0.90 0.008 203);
  --line-strong: oklch(0.85 0.01 203);
  --sel-bg: oklch(0.97 0.012 200);
  --bezel: oklch(0.22 0.02 205);
  --scrim: oklch(0.22 0.035 205 / 0.45);
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-btn: 10px;
  --r-row: 14px;
  --r-card: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--mist); color: var(--ink); font-family: var(--text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
ol, li, p { text-wrap: pretty; }

.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.masthead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.masthead .word { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: -0.03em; }
.masthead .rule { width: 1px; height: 17px; background: var(--line-strong); }
.masthead .sub { font-size: 14px; color: var(--muted); }

.stage { display: flex; gap: 32px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

/* Phone */
.phone { width: 392px; max-width: 100%; height: 812px; background: var(--bezel); border-radius: 44px; padding: 11px; box-shadow: 0 20px 48px oklch(0.3 0.03 205 / 0.18); flex: 0 0 auto; }
.screen { width: 100%; height: 100%; background: var(--paper); border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.status { padding: 16px 26px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
.appbar { padding: 10px 24px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.exit { display: flex; align-items: center; gap: 7px; background: none; border: 0; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 4px; border-radius: 6px; }
.scroller { flex: 1; overflow-y: auto; padding: 20px 24px 32px; scroll-behavior: auto; }

.back { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; background: none; border: 0; padding: 2px 0; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--action); }
.h1 { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; margin: 0 0 16px; text-wrap: balance; }
.h2 { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 14px; }
.lede { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: -6px 0 14px; }
.copy { font-size: 15px; color: var(--body); line-height: 1.6; margin: 0 0 24px; }
.steps { margin: 0 0 26px; padding-left: 20px; color: var(--body); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; gap: 7px; }
.group-label { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.section + .section { margin-top: 24px; }

.search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-btn); padding: 12px 14px; margin-bottom: 12px; color: var(--faint); font-size: 14.5px; }
.textlink { font-size: 14.5px; font-weight: 500; color: var(--action); background: none; border: 0; padding: 0; cursor: pointer; display: inline-block; margin-bottom: 26px; }

/* Rows: one component for every tappable choice that navigates */
.row { width: 100%; display: flex; align-items: center; gap: 16px; text-align: left; border: 1px solid var(--line); border-radius: var(--r-row); padding: 16px; background: var(--paper); cursor: pointer; transition: border-color 120ms ease, background 120ms ease; }
.row:hover { border-color: var(--line-strong); background: var(--sel-bg); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-size: 15px; font-weight: 600; color: var(--ink); display: block; }
.row .meta { font-size: 13px; color: var(--muted); display: block; margin-top: 1px; font-variant-numeric: tabular-nums; }
.row .label { font-size: 14.5px; font-weight: 500; color: var(--ink-2); line-height: 1.35; }
.row.tall { padding: 18px; }
.thumb { width: 52px; height: 40px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; overflow: hidden; }
.thumb img { width: 46px; height: 32px; object-fit: contain; }
.chev { flex: 0 0 auto; }

/* Radio options */
.opt { width: 100%; display: flex; align-items: center; gap: 15px; text-align: left; border: 1.5px solid var(--line); border-radius: var(--r-row); padding: 18px; background: var(--paper); cursor: pointer; font-size: 14.5px; font-weight: 500; color: var(--ink-2); line-height: 1.4; }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
.opt[aria-checked="true"] { border-color: var(--action); background: var(--sel-bg); }
.opt[aria-checked="true"] .dot { border-color: var(--action); }
.opt[aria-checked="true"] .dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--action); }
.opt-pair { display: flex; gap: 10px; }
.opt-pair .opt { flex: 1; }
.q + .q { margin-top: 30px; }
.rise { animation: rise 320ms ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Device card */
.device-card { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: var(--r-card); background: var(--tile); margin-bottom: 24px; }
.device-card .thumb { width: 56px; height: 44px; }
.device-card .thumb img { width: 56px; height: 40px; }
.device-card .name { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.device-card .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Buttons: inline actions hug their label; full width only inside sheets */
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 15px 26px; border-radius: var(--r-btn); font-family: var(--display); font-size: 15px; font-weight: 600; cursor: pointer; border: 0; background: var(--action); color: var(--on-action); }
.btn:hover { background: var(--action-hover); }
.btn.secondary { background: var(--paper); color: var(--action); border: 1px solid var(--line-strong); font-weight: 500; }
.btn.secondary:hover { background: var(--sel-bg); }
.btn.block { width: 100%; }
.mt { margin-top: 26px; }

/* Accordions */
.acc { border-top: 1px solid var(--line); }
.acc-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 16px 0; background: none; border: 0; cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--ink-2); text-align: left; }
.acc-head svg { transition: transform 200ms ease; transform: rotate(180deg); }
.acc-head[aria-expanded="true"] svg { transform: rotate(0deg); }
.acc-body { padding-bottom: 18px; }
.acc-body .steps { margin: 0; font-size: 14.5px; gap: 8px; }
.acc-body strong { font-weight: 600; color: var(--ink); }
.acc-q { font-size: 14.5px; color: var(--body); margin: 0 0 12px; }

/* Loaders */
.dots { display: flex; gap: 7px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--action); animation: blink 1.1s ease-in-out infinite; }
.dots span:nth-child(2) { animation-delay: 0.18s; } .dots span:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
.spinner { width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--mint); animation: spin 900ms linear infinite; margin: 4px 0 22px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Result table */
.facts { border-top: 1px solid var(--line); margin-bottom: 26px; }
.fact { display: flex; justify-content: space-between; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.fact dt { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.fact dd { margin: 0; text-align: right; font-size: 14.5px; color: var(--ink-2); }
.fact dd small { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Sheet */
.sheet-wrap { position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; z-index: 5; border-radius: 34px; animation: fade 180ms ease-out both; }
.sheet { width: 100%; background: var(--paper); border-radius: 24px 24px 34px 34px; padding: 20px 24px 30px; display: flex; flex-direction: column; animation: up 240ms ease-out both; }
.grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); align-self: center; margin-bottom: 22px; }
.sheet p { font-size: 14.5px; color: var(--body); line-height: 1.5; margin: 0 0 22px; }
.sheet .textlink { align-self: center; margin: 18px 0 0; font-size: 13.5px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }

.toast { position: absolute; left: 24px; right: 24px; bottom: 22px; background: var(--ink); color: var(--paper); font-size: 13.5px; line-height: 1.45; padding: 12px 14px; border-radius: 12px; z-index: 6; animation: up 200ms ease-out both; }

/* Step rail */
.rail { flex: 0 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.rail h2 { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail button { width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--body); }
.rail button .n { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 12.5px; width: 18px; }
.rail button:hover { background: var(--tile); }
.rail button[aria-current="step"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.rail button[aria-current="step"] .n { color: var(--action); }
.rail .note { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }
.rail .restart { align-self: flex-start; background: none; border: 0; padding: 0 10px; cursor: pointer; color: var(--action); font-weight: 500; font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
html, body { height: 100%; min-height: 0; margin: 0; }
body { padding: 0; background: transparent; display: grid; place-items: center; overflow: hidden; }
.embed { width: 392px; height: 812px; flex: 0 0 auto; transform-origin: center center; }
.screen { pointer-events: none; }
.phone { box-shadow: 0 18px 40px oklch(0.3 0.03 205 / 0.16); }
.tap { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-radius: 50%; background: oklch(0.42 0.07 203 / 0.16); border: 2px solid oklch(0.42 0.07 203 / 0.5); z-index: 20; opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
.tap.on { animation: tap 620ms ease-out; }
@keyframes tap { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); } }

</style>
</head>

            <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.6" y="0.6" width="20" height="9.8" rx="2.6" fill="none" stroke="var(--faint)" stroke-width="1.2"/><rect x="2.2" y="2.2" width="16.5" height="6.6" rx="1.6" fill="var(--ink)"/><rect x="22" y="3.6" width="1.6" height="3.8" rx="0.8" fill="var(--faint)"/></svg>

          </button>

        <div id="overlay"></div>

</div>

        '<button type="button" class="row tall" data-act="restart"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="flex:0 0 auto"><path d="M4 12 a8 8 0 1 1 2.3 5.6" fill="none" stroke="var(--ink-2)" stroke-width="1.7" stroke-linecap="round"/><path d="M3.4 8.6 L4 12.4 L7.6 11.4" fill="none" stroke="var(--ink-2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="main"><span class="title">Troubleshoot another issue</span><span class="meta">Get help for another issue with this or a different device.</span></span>' + CHEV + '</button>';
    },
    test: function () {
      return back() + deviceCard() + '<h1 class="h1" style="margin-bottom:12px">Run the touchscreen response test on your device</h1>' +
        '<p class="copy">We’ll run a test on your device display to check touch performance. Select Start test, then complete the prompts on your screen. This page updates automatically when finished.</p>' +
        '<button type="button" class="btn" data-act="start">Start test</button>';
    },
    launching: function () {
      return back() + deviceCard() +
        '<div style="display:flex;align-items:center;gap:16px;margin-bottom:22px"><svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true"><rect x="2" y="2" width="20" height="14" rx="2" fill="none" stroke="var(--ink-2)" stroke-width="1.8"/><rect x="24" y="22" width="16" height="15" rx="2" fill="none" stroke="var(--ink-2)" stroke-width="1.8"/><path d="M26 9 a11 11 0 0 1 -12 14" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round"/><path d="M11 19 l3 4.6 l4.6 -2.4" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div></div>' +
        '<p class="copy">Connecting to your device. The test will launch on your screen shortly.</p>' +
        accordion('launchOpen', 'Test didn’t launch on your device?', s.launchOpen,
          '<ol class="steps"><li>Go to your device home screen and tap <strong>Hardware Tests</strong>.</li><li>Tap <strong>Touchscreen response test</strong> and follow the prompts.</li></ol>') +
        accordion('updateOpen', 'Page didn’t update after the test?', s.updateOpen, manualBlock());
    },
    uploading: function () {
      return back() + deviceCard() + '<div class="spinner" role="status" aria-label="Uploading"></div>' +
        '<p class="copy">We’re uploading your test results. This usually takes less than a minute. This page updates automatically when finished.</p>' +
        accordion('updateOpen', 'Page didn’t update after the test?', s.updateOpen, manualBlock());
    },
    result: function () {
      return back() + deviceCard() + '<div class="rise"><h1 class="h1" style="margin-bottom:12px">Your device issue qualifies for replacement</h1>' +
        '<p class="copy">We know it’s frustrating when your device isn’t working as expected. Based on the reported issue, a replacement is the best next step. Review your available replacement options to get back up and running.</p>' +
        '<dl class="facts" style="margin-top:0"><div class="fact"><dt>Device ownership</dt><dd>Owned device<small>Purchased on November 10, 2024</small></dd></div>' +
        '<div class="fact"><dt>Coverage</dt><dd>Orbit Care<small>Expires on November 10, 2027</small><small>3 device replacements remaining</small></dd></div></dl>' +
        '<button type="button" class="btn" data-act="toast" data-msg="This is where the replacement flow picks up. It’s outside this prototype.">See replacement options</button></div>';
    }
  };

  function renderOverlay() {
    var h = '';
    if (s.sheet) {
      h += '<div class="sheet-wrap" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" data-stop="1"><div class="grabber" aria-hidden="true"></div>' +
        '<h2 class="h1" id="sheetTitle" style="margin-bottom:10px">Exit troubleshooting?</h2>' +
        '<p>We’ll remember this session. If you contact support later, they’ll see the steps you’ve already tried on ' + esc(s.device.name) + '.</p>' +
        '<div class="stack"><button type="button" class="btn block" data-act="closeSheet">Keep troubleshooting</button><button type="button" class="btn secondary block" data-act="restart">Close and exit</button></div>' +
        '<button type="button" class="textlink" data-act="toast" data-msg="Hands off to support with this session attached.">Contact support</button></div></div>';
    }
    if (s.toast) h += '<div class="toast" role="status">' + esc(s.toast) + '</div>';
    overlay.innerHTML = h;
  }

  function renderRail() {
    var current = s.sheet ? 'exit' : s.step;
    rail.innerHTML = STEPS.map(function (st, i) {
      var n = (i + 1 < 10 ? '0' : '') + (i + 1);
      return '<li><button type="button" data-act="jump" data-to="' + st[0] + '"' + (st[0] === current ? ' aria-current="step"' : '') + '><span class="n">' + n + '</span>' + st[1] + '</button></li>';
    }).join('');
  }

  function render(keepScroll) {
    var top = scroller.scrollTop;
    scroller.innerHTML = VIEWS[s.step]();
    scroller.scrollTop = keepScroll ? top : 0;
    renderOverlay();
    renderRail();
  }

  function go(step) { s.step = step; s.sheet = false; render(); }

  function smoothTo(el) {
    if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var anchor = document.getElementById('q1');
    var target = Math.max(0, Math.min(el.offsetTop - (anchor ? anchor.offsetTop : 0), scroller.scrollHeight - scroller.clientHeight));
    if (reduce) { scroller.scrollTop = target; return; }
    var start = scroller.scrollTop, delta = target - start, t0 = performance.now();
    if (Math.abs(delta) < 2) return;
    (function tick(t) {
      var p = Math.min(1, (t - t0) / 520);
      scroller.scrollTop = start + delta * (1 - Math.pow(1 - p, 3));
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }

  var toastTimer;
  function toast(msg) {
    s.toast = msg; renderOverlay();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { s.toast = null; renderOverlay(); }, 2800);
  }

  function startTest() {
    clearTimers();
    s.launchOpen = false; s.updateOpen = false; s.manual = null;
    go('launching');
    timers.push(setTimeout(function () { s.launchOpen = false; go('uploading'); }, 3200));
    timers.push(setTimeout(function () { s.updateOpen = false; go('result'); }, 6600));
  }

  function jump(to) {
    clearTimers();
    var f = fresh();
    f.device = s.device;
    if (to === 'exit') { f.step = 'fix'; f.sheet = true; }
    else f.step = to;
    if (['symptoms'].indexOf(to) > -1) { f.q1 = Q1[1]; f.q2 = Q2[0]; f.q3 = 'No'; }
    s = f;
    render();
    if (to === 'launching') { timers.push(setTimeout(function () { go('uploading'); }, 3200)); timers.push(setTimeout(function () { go('result'); }, 6600)); }
    if (to === 'uploading') { timers.push(setTimeout(function () { go('result'); }, 3400)); }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    var a = el.dataset.act;
    if (a === 'device') {
      var g = GROUPS.filter(function (x) { return x.key === el.dataset.g; })[0];
      var d = g.devices[+el.dataset.i];
      s.device = { name: d[0], model: g.model, serial: d[1], img: IMG[g.key] };
      go('category');
    } else if (a === 'cat') {
      if (+el.dataset.i === 0) { s.q1 = s.q2 = s.q3 = null; go('symptoms'); }
      else toast('This prototype follows the screen path. Other categories use the same templates.');
    } else if (a === 'pick') {
      var key = el.dataset.key, list = { q1: Q1, q2: Q2, q3: Q3, manual: MANUAL }[key];
      var first = !s[key];
      s[key] = list[+el.dataset.i];
      render(true);
      if (first) {
        var next = { q1: 'q2', q2: 'q3', q3: 'q4' }[key];
        if (next) requestAnimationFrame(function () { requestAnimationFrame(function () { smoothTo(document.getElementById(next)); }); });
      }
    } else if (a === 'go') {
      if (el.dataset.to === 'result') clearTimers();
      go(el.dataset.to);
    } else if (a === 'back') {
      clearTimers();
      if (s.step === 'device') toast('Returns to Devices and printers.');
      else if (s.step === 'category') go('device');
      else { s.q1 = s.q2 = s.q3 = null; s.manual = null; go('category'); }
    } else if (a === 'toggle') {
      s[el.dataset.key] = !s[el.dataset.key]; render(true);
    } else if (a === 'start') startTest();
    else if (a === 'toast') toast(el.dataset.msg);
    else if (a === 'closeSheet') { s.sheet = false; renderOverlay(); renderRail(); }
    else if (a === 'restart') { clearTimers(); s = fresh(); render(); }
    else if (a === 'jump') jump(el.dataset.to);
  });
  document.getElementById('exitBtn').addEventListener('click', function () { s.sheet = true; renderOverlay(); renderRail(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && s.sheet) { s.sheet = false; renderOverlay(); renderRail(); } });

  window.__orbit = { reset: function () { clearTimers(); s = fresh(); render(); } };
  render();
})();
</script>

<script>
(function () {
  var embed = document.querySelector('.embed');
  function fit() { var s = Math.min(window.innerWidth / 420, window.innerHeight / 840, 1.5); embed.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var screen = document.getElementById('screen');
  var tap = document.createElement('div'); tap.className = 'tap'; tap.setAttribute('aria-hidden', 'true'); screen.appendChild(tap);
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function find(sel, text) { return Array.prototype.slice.call(document.querySelectorAll(sel)).filter(function (e) { return !text || e.textContent.indexOf(text) > -1; })[0]; }
  async function press(sel, text) {
    var el = find(sel, text); if (!el) return;
    var sr = screen.getBoundingClientRect(), er = el.getBoundingClientRect(), k = sr.width / screen.offsetWidth;
    tap.style.left = ((er.left + er.width / 2 - sr.left) / k) + 'px';
    tap.style.top = ((er.top + er.height / 2 - sr.top) / k) + 'px';
    tap.classList.remove('on'); void tap.offsetWidth; tap.classList.add('on');
    await sleep(240); el.click();
  }
  async function run() {
    for (;;) {
      await sleep(1700); await press('[data-act=device]', 'Bar Compact');
      await sleep(1600); await press('[data-act=cat]', 'Screen');
      await sleep(1500); await press('.opt', 'The screen looks wrong');
      await sleep(1400); await press('.opt', 'The screen is flickering');
      await sleep(1300); await press('.opt-pair .opt', 'No');
      await sleep(1200); await press('[data-act=go][data-to=fix]');
      await sleep(2600); await press('[data-act=go][data-to=test]');
      await sleep(1800); await press('[data-act=start]');
      await sleep(10200);
      window.__orbit.reset();
    }
  }
  run();
})();
</script>
</body>
</html>
