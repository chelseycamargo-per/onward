<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Nova Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Nova troubleshooting conversation, autoplaying embed. Orbit Petrol tokens, transparent page. */
:root {
  --ink: oklch(0.22 0.035 205);
  --ink-2: oklch(0.28 0.03 205);
  --body: oklch(0.33 0.025 205);
  --muted: oklch(0.50 0.02 203);
  --faint: oklch(0.58 0.02 203);
  --action: oklch(0.42 0.07 203);
  --on-action: oklch(0.99 0.002 200);
  --mint: oklch(0.58 0.12 172);
  --tile: oklch(0.96 0.008 200);
  --bubble: oklch(0.94 0.012 200);
  --paper: oklch(0.995 0.002 200);
  --line: oklch(0.90 0.008 203);
  --sel-bg: oklch(0.97 0.012 200);
  --bezel: oklch(0.22 0.02 205);
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: transparent; display: grid; place-items: center; overflow: hidden; font-family: var(--text); color: var(--ink); }
.embed { width: 392px; height: 812px; flex: 0 0 auto; transform-origin: center center; }
.phone { width: 392px; height: 812px; background: var(--bezel); border-radius: 44px; padding: 11px; box-shadow: 0 18px 40px oklch(0.3 0.03 205 / 0.16); }
.screen { width: 100%; height: 100%; background: var(--paper); border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.status { padding: 16px 26px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
.bar { padding: 10px 20px 14px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.bar .who { flex: 1; display: flex; align-items: center; gap: 10px; }
.mark { width: 28px; height: 28px; border-radius: 50%; background: var(--action); display: grid; place-items: center; }
.bar .name { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.bar .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.bar .sub i { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); display: inline-block; }
.log { flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.log::-webkit-scrollbar { display: none; }
.msg { animation: rise 280ms ease-out both; }
.me { align-self: flex-end; max-width: 80%; background: var(--bubble); color: var(--ink); padding: 11px 15px; border-radius: 18px 18px 6px 18px; font-size: 15px; line-height: 1.45; }
.bot { align-self: flex-start; max-width: 94%; font-size: 15px; line-height: 1.55; color: var(--body); display: flex; flex-direction: column; gap: 10px; }
.bot p { margin: 0; }
.bot ol, .bot ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.bot strong { color: var(--ink); font-weight: 600; }
.typing { align-self: flex-start; display: flex; gap: 5px; padding: 6px 0; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay: 0.15s; } .typing span:nth-child(3) { animation-delay: 0.3s; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
.choice { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--paper); transition: opacity 240ms ease, border-color 240ms ease, background 240ms ease; }
.choice img { width: 52px; height: 36px; object-fit: contain; flex: 0 0 auto; }
.choice .t { font-size: 15px; font-weight: 600; color: var(--ink); }
.choice .m { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.choice.on { border: 1.5px solid var(--action); background: var(--sel-bg); }
.choice.off { opacity: 0.45; }
.launch { align-self: flex-start; margin-top: 4px; padding: 13px 20px; border-radius: 10px; background: var(--action); color: var(--on-action); font-family: var(--display); font-size: 15px; font-weight: 600; }
.compose { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px 18px; border-top: 1px solid var(--line); }
.field { flex: 1; min-height: 44px; display: flex; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 15px; color: var(--faint); }
.field.typing-in { color: var(--ink); }
.field .caret { display: inline-block; width: 1.5px; height: 18px; background: var(--action); margin-left: 1px; vertical-align: middle; animation: caret 1s steps(1) infinite; }
.send { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--tile); transition: background 160ms ease; }
.send.ready { background: var(--action); }
.send.ready path { stroke: var(--on-action); }
.tap { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-radius: 50%; background: oklch(0.42 0.07 203 / 0.16); border: 2px solid oklch(0.42 0.07 203 / 0.5); z-index: 20; opacity: 0; transform: translate(-50%, -50%) scale(0.5); pointer-events: none; }
.tap.on { animation: tap 620ms ease-out; }
@keyframes tap { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>
</head>
<body>
<div class="embed">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="status">
        <span>9:41</span>
        <span style="display:flex;gap:6px;align-items:center" aria-hidden="true">
          <svg width="17" height="11" viewBox="0 0 17 11"><rect y="7" width="3" height="4" rx="1" fill="var(--ink)"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="var(--ink)"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="var(--ink)"/><rect x="13.5" width="3" height="11" rx="1" fill="var(--ink)"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.6" y="0.6" width="20" height="9.8" rx="2.6" fill="none" stroke="var(--faint)" stroke-width="1.2"/><rect x="2.2" y="2.2" width="16.5" height="6.6" rx="1.6" fill="var(--ink)"/><rect x="22" y="3.6" width="1.6" height="3.8" rx="0.8" fill="var(--faint)"/></svg>
        </span>
      </div>
      <div class="bar">
        <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><path d="M7.5 1.4 L1.4 8 L7.5 14.6 M1.8 8 L16.8 8" fill="none" stroke="var(--ink-2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="who">
          <span class="mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 66 66"><path fill-rule="evenodd" d="M33 2 a31 31 0 1 1 0 62 a31 31 0 1 1 0 -62 Z M41 31 a17 17 0 1 1 0 34 a17 17 0 1 1 0 -34 Z" fill="var(--on-action)"/></svg></span>
          <div><div class="name">Nova</div><div class="sub"><i></i>Orbit assistant</div></div>
        </div>
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2 L14 14 M14 2 L2 14" stroke="var(--ink-2)" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="compose">
        <div class="field" id="field">Ask Nova anything…</div>
        <div class="send" id="send"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 L20 4 L16 20 L11.5 13.5 Z M11.5 13.5 L20 4" fill="none" stroke="var(--ink-2)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
      </div>
    </div>
  </div>
</div>
<script>

  var embed = document.querySelector('.embed');
  function fit() { var s = Math.min(window.innerWidth / 420, window.innerHeight / 840, 1.5); embed.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();

  var screen = document.getElementById('screen'), log = document.getElementById('log'), field = document.getElementById('field'), send = document.getElementById('send');
  var tap = document.createElement('div'); tap.className = 'tap'; tap.setAttribute('aria-hidden', 'true'); screen.appendChild(tap);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function scrollDown() {
    var target = log.scrollHeight - log.clientHeight;
    if (reduce) { log.scrollTop = target; return; }
    var start = log.scrollTop, d = target - start, t0 = performance.now();
    if (d <= 0) return;
    (function step(t) { var p = Math.min(1, (t - t0) / 450); log.scrollTop = start + d * (1 - Math.pow(1 - p, 3)); if (p < 1) requestAnimationFrame(step); })(t0);
  }
  function press(el) {
    var sr = screen.getBoundingClientRect(), er = el.getBoundingClientRect(), k = sr.width / screen.offsetWidth;
    tap.style.left = ((er.left + er.width / 2 - sr.left) / k) + 'px';
    tap.style.top = ((er.top + er.height / 2 - sr.top) / k) + 'px';
    tap.classList.remove('on'); void tap.offsetWidth; tap.classList.add('on');
  }
  function add(node) { log.appendChild(node); scrollDown(); return node; }
  function el(cls, html) { var d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }

  async function say(text) {
    field.classList.add('typing-in');
    for (var i = 1; i <= text.length; i++) {
      field.innerHTML = text.slice(0, i).replace(/</g, '&lt;') + '<span class="caret"></span>';
      await sleep(38);
    }
    send.classList.add('ready');
    await sleep(380); press(send); await sleep(220);
    field.classList.remove('typing-in'); field.textContent = 'Ask Nova anything…'; send.classList.remove('ready');

    await sleep(pause || 1100);
    t.remove();
    var m = add(el('msg bot', html));
    await sleep(900);
    return m;
  }

  async function run() {
    for (;;) {
      log.innerHTML = ''; log.scrollTop = 0;
      await sleep(900);
      await say('The screen on my device is flickering');
      await reply('<p>I can help with that. Which device is having the issue?</p><p>You can tell me the device name, device type, or serial number.</p>');
